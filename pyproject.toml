[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "groovemap-deployment-validation"
version = "0.0.0"
description = "Validation tooling for the unversioned GrooveMap deployment repository"
requires-python = ">=3.13"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = ["pyyaml==6.0.3"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "commitizen>=4.18.0",
    "cyclonedx-bom>=7.3.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.4",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv]
package = false
exclude-newer = "2 days"

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["ARG", "B", "C4", "E", "F", "I", "PLC", "PTH", "RUF", "S", "SIM", "T20", "TCH", "UP", "W"]
ignore = ["B008", "C901", "E501", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLC", "S105", "S106", "S603", "T201"]
"scripts/*.py" = ["S108", "T201"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
files = ["scripts", "tests/deploy"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests/deploy"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
timeout_method = "thread"
markers = [
    "benchmark: performance regression benchmarks",
    "e2e: end-to-end tests requiring external services",
    "integration: tests requiring a live backing service",
]

[tool.coverage.run]
source = ["scripts"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
version_files = []
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
