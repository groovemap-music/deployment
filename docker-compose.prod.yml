---
# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Restarts: every long-running service sets `restart: always` here, and nothing
# in this file may set deploy.restart_policy. Docker Compose lets deploy.restart_policy
# override `restart:`, and the engine only accepts a retry cap (max_attempts) with
# on-failure, so `always` plus max_attempts is rejected at `up` (observed on Compose
# 5.6.1: "maximum retry count can only be used with 'on-failure'"). `always` never
# gives up on a crashing service; Docker backs off between attempts. Pinned by
# tests/deploy/test_docker_compose_prod.py.
# Note: When using deploy.replicas, container_name from base config is ignored
#
# Secrets: populate secrets/ from secrets.example/ and run scripts/create-secrets.sh
# See: scripts/create-secrets.sh for automated secret generation

secrets:
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  neo4j_password:
    file: ./secrets/neo4j_password.txt
  encryption_master_key:
    file: ./secrets/encryption_master_key.txt
  # Required for email delivery — create with: scripts/create-secrets.sh or manually
  resend_api_key:
    file: ./secrets/resend_api_key.txt
  nlq_api_key:
    file: ./secrets/nlq_api_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_username:
    file: ./secrets/postgres_username.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  rabbitmq_username:
    file: ./secrets/rabbitmq_username.txt
  valkey_password:
    file: ./secrets/valkey_password.txt
  # oliver006/redis_exporter reads --redis.password-file as a JSON map of Redis
  # URI to password, not a plain password. scripts/create-secrets.sh derives this
  # file from valkey_password.txt on every run, so the two cannot disagree.
  valkey_exporter_passwords:
    file: ./secrets/valkey_exporter_passwords.json
  # Shared secret gating /api/internal/insights/* (api/routers/insights_compute.py).
  # Base docker-compose.yml falls back to a repo-published dev default when this
  # isn't set. Production must always override it with this file-backed secret.
  insights_internal_secret:
    file: ./secrets/insights_internal_secret.txt
  # Grafana admin login. Anonymous access is disabled in prod, so this is the
  # only way into the dashboards.
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  # Optional Grafana Viewer service-account token the console reads firing alerts
  # with. Empty by default: the console then shows only the problems it derives
  # itself. See docs/maintenance.md#grafana-viewer-token-for-the-console.
  grafana_viewer_token:
    file: ./secrets/grafana_viewer_token.txt
  # The embedding pipeline's own least-privilege login (ADR 0013's 2026-09-24
  # amendment) — a member of database-schema's NOLOGIN embedding_pipeline group
  # role, never this stack's postgres_username superuser. See
  # scripts/provision-embedding-pipeline-login.sh and
  # docs/maintenance.md#monthly-embedding-refresh.
  embedding_pipeline_username:
    file: ./secrets/embedding_pipeline_username.txt
  embedding_pipeline_password:
    file: ./secrets/embedding_pipeline_password.txt

# Production logging and telemetry context share this application-service anchor.
# The base file's OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_SERVICE_NAME carry over;
# resource attributes and the head sampling rate are re-stamped below.
x-otel-prod-env: &otel-prod-env
  ENVIRONMENT: "production"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=groovemap,deployment.environment.name=prod"
  # Production keeps a tenth of the traces. The sampler itself
  # (`parentbased_traceidratio`) is unchanged from the base file, so a trace
  # sampled at the edge is still recorded end to end — only the head rate at
  # the edge changes.
  OTEL_TRACES_SAMPLER_ARG: "0.1"

services:
  rabbitmq:
    restart: always
    entrypoint: ["/scripts/rabbitmq-entrypoint.sh"]
    command: ["rabbitmq-server"]
    # Keep the rabbitmq_prometheus port on loopback only: host-side operator
    # tools reach /metrics/detailed, nothing on public interfaces does.
    # Compose merges this with the identical base entry.
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_METRICS_HOST_PORT:-15692}:15692"
    volumes:
      - ./scripts/rabbitmq-entrypoint.sh:/scripts/rabbitmq-entrypoint.sh:ro
    secrets:
      - rabbitmq_password
      - rabbitmq_username

  # gm-deployment-8mb.1: authenticate to the management API with the same
  # Docker _FILE secret credential the rabbitmq service itself uses, instead
  # of the base file's plaintext RABBITMQADMIN_USERNAME/PASSWORD.
  rabbitmq-dlq-policy-init:
    secrets:
      - rabbitmq_password
      - rabbitmq_username

  postgres:
    restart: always
    command:
      - "postgres"
      # --- Memory ---
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "huge_pages=try"
      - "-c"
      - "wal_buffers=64MB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      # --- I/O (SSD-optimized) ---
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "seq_page_cost=1.0"
      # --- Parallelism ---
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "max_parallel_maintenance_workers=4"
      - "-c"
      - "parallel_leader_participation=on"
      # --- Query Planner ---
      - "-c"
      - "default_statistics_target=200"
      - "-c"
      - "jit=on"
      # --- Connections ---
      - "-c"
      - "max_connections=100"
      # --- Logging / Diagnostics ---
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_temp_files=0"
      # --- Autovacuum Tuning ---
      - "-c"
      - "autovacuum_max_workers=4"
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.05"
      - "-c"
      - "autovacuum_analyze_scale_factor=0.025"
      - "-c"
      - "autovacuum_vacuum_cost_delay=2ms"
    environment:
      POSTGRES_DB: groovemap
      POSTGRES_USER:  # unset base value so _FILE takes effect
      POSTGRES_USER_FILE: /run/secrets/postgres_username
      POSTGRES_PASSWORD:  # unset base value so _FILE takes effect
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_username
      - postgres_password

  neo4j:
    restart: always
    entrypoint: ["/scripts/neo4j-entrypoint.sh"]
    command: ["neo4j"]
    volumes:
      - ./scripts/neo4j-entrypoint.sh:/scripts/neo4j-entrypoint.sh:ro
    secrets:
      - neo4j_password
    # The base healthcheck authenticates with the literal dev password, but
    # neo4j-entrypoint.sh sets NEO4J_AUTH from /run/secrets/neo4j_password (a
    # random value in prod). Probe with the SAME secret the server was seeded
    # from — otherwise the check fails auth forever, neo4j never turns healthy,
    # and every service gated on `neo4j: service_healthy` deadlocks at boot.
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$(cat /run/secrets/neo4j_password)\" 'RETURN 1 AS health'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      JAVA_TOOL_OPTIONS: '--enable-native-access=ALL-UNNAMED'
      NEO4J_dbms_memory_transaction_total_max: ${NEO4J_TRANSACTION_MEMORY_MAX:-8G}
      # --- Memory: heap 8G + page cache 16G = ~24G (fits 25GB store in cache); the transaction
      # cap must stay below the heap or it bounds nothing (`just deploy` sizes all four) ---
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_SIZE:-8g}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_SIZE:-8g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-16g}
      NEO4J_server_memory_pagecache_flush_buffer_size__in__pages: '512'
      # --- JVM Tuning for large heap with 131M relationships ---
      NEO4J_server_jvm_additional: >-
        -XX:+UseG1GC
        -XX:G1HeapRegionSize=16m
        -XX:+AlwaysPreTouch
        -XX:+DisableExplicitGC
        -XX:+ExitOnOutOfMemoryError
        -XX:+UseCompressedOops
        -XX:MaxGCPauseMillis=200
        -XX:G1ReservePercent=15
        -XX:InitiatingHeapOccupancyPercent=45
        -XX:SurvivorRatio=8
        -XX:+ParallelRefProcEnabled
        -XX:FlightRecorderOptions=stackdepth=256
        --add-modules jdk.incubator.vector
        --enable-native-access=ALL-UNNAMED
      # --- I/O and Checkpointing ---
      NEO4J_db_checkpoint_iops_limit: '4000'
      NEO4J_db_checkpoint_interval_time: '15m'
      NEO4J_db_checkpoint_interval_tx: '1000000'
      # --- Query Logging ---
      NEO4J_db_logs_query_threshold: '5s'
      NEO4J_db_logs_query_plan__description__enabled: 'true'
      NEO4J_db_transaction_timeout: '600s'
      NEO4J_db_transaction_bookmark__ready__timeout: '30s'
      NEO4J_dbms_cypher_min__replan__interval: '5s'
      NEO4J_dbms_cypher_statistics__divergence__threshold: '0.1'
      NEO4J_server_bolt_thread__pool__min__size: '10'
      NEO4J_server_bolt_thread__pool__max__size: '400'
      NEO4J_server_bolt_connection__keep__alive__for__requests: 'ALL'
      NEO4J_server_bolt_connection__keep__alive: '30m'
    deploy:
      resources:
        limits:
          memory: ${NEO4J_MEMORY_LIMIT:-48G}

  # Base docker-compose.yml runs valkey with no --requirepass and publishes 6379 to
  # 0.0.0.0 — unlike every other stateful service, prod gave it no hardening
  # override, so anyone who can reach host:6379 could FLUSHALL / read the
  # insights+dashboard cache with zero credentials.
  valkey:
    restart: always
    entrypoint: ["/scripts/valkey-entrypoint.sh"]
    volumes:
      - ./scripts/valkey-entrypoint.sh:/scripts/valkey-entrypoint.sh:ro
    # Bind to loopback only — valkey is meant to be reached over the internal
    # groovemap network by api/dashboard/insights, not from the host's
    # public interfaces. `!override` fully replaces (not merges) the base
    # file's "6379:6379" (0.0.0.0) publish.
    ports: !override
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${VALKEY_HOST_PORT:-6379}:6379"
    secrets:
      - valkey_password
    # Base healthcheck ("valkey-cli ping" with no auth) would fail once
    # --requirepass is set above — authenticate using the same secret file.
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$(cat /run/secrets/valkey_password)\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The exporters read the same credentials as the application services, via
  # the same file-backed secrets. postgres_exporter reads the *_FILE variant when it is set; the plain values are unset here
  # anyway so a stale dev credential cannot win.
  postgres-exporter:
    restart: always
    environment:
      DATA_SOURCE_PASS:  # unset base value so _FILE takes effect
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
      DATA_SOURCE_USER:  # unset base value so _FILE takes effect
      DATA_SOURCE_USER_FILE: /run/secrets/postgres_username
    secrets:
      - postgres_username
      - postgres_password

  # REDIS_PASSWORD_FILE names the JSON map above; its key must equal the base
  # file's REDIS_ADDR (redis://valkey:6379) for the password to be applied.
  valkey-exporter:
    restart: always
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/valkey_exporter_passwords
    secrets:
      - valkey_exporter_passwords

  # Neither host exporter publishes a port and neither takes a credential, so
  # prod only needs the restart policy. cadvisor's two capabilities and its
  # /dev/kmsg device are the same in both environments: they are what make OOM
  # events observable at all, and production is where that matters most.
  cadvisor:
    restart: always

  node-exporter:
    restart: always

  # The base file publishes 8428 on 0.0.0.0 for local PromQL work.
  # VictoriaMetrics has no authentication of its own and its API can delete
  # series, so in prod it is bound to loopback and reached through Grafana (or
  # an SSH tunnel). `!override` fully replaces (not merges) the base publish.
  victoria-metrics:
    restart: always
    ports: !override
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${VICTORIA_METRICS_HOST_PORT:-8428}:8428"

  # Same reasoning for the trace store: 10428 accepts unauthenticated span
  # ingest as well as queries, so it never faces the host's public interfaces.
  victoria-traces:
    restart: always
    ports: !override
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${VICTORIA_TRACES_HOST_PORT:-10428}:10428"

  otel-collector:
    restart: always

  grafana:
    restart: always
    environment:
      # Anonymous Viewer access is a dev-only convenience.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD:  # unset base value so __FILE takes effect
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password

  schema-init:
    environment:
      <<: *otel-prod-env
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USERNAME_FILE: /run/secrets/postgres_username
    secrets:
      - neo4j_password
      - postgres_username
      - postgres_password

  api:
    restart: always
    environment:
      <<: *otel-prod-env
      # REQUIRED in production: the public origin of the Explore frontend.
      # Password reset emails embed this as an absolute link, so the localhost
      # default would mail every recipient a link to their own machine.
      APP_BASE_URL: "${APP_BASE_URL:?APP_BASE_URL must be set to the public frontend origin}"
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      ENCRYPTION_MASTER_KEY_FILE: /run/secrets/encryption_master_key
      # Optional — Resend email (when not set, password reset links are logged)
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      RESEND_SENDER_EMAIL: "${RESEND_SENDER_EMAIL:-noreply@groovemap.music}"
      RESEND_SENDER_NAME: "${RESEND_SENDER_NAME:-GrooveMap}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USERNAME_FILE: /run/secrets/postgres_username
      NLQ_API_KEY_FILE: /run/secrets/nlq_api_key
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      RABBITMQ_USERNAME_FILE: /run/secrets/rabbitmq_username
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      INSIGHTS_INTERNAL_SECRET_FILE: /run/secrets/insights_internal_secret
    secrets:
      - jwt_secret_key
      - neo4j_password
      - encryption_master_key
      - resend_api_key
      - nlq_api_key
      - postgres_username
      - postgres_password
      - rabbitmq_username
      - rabbitmq_password
      - valkey_password
      - insights_internal_secret
    volumes:
      - api_logs:/logs
      - discogs_data:/discogs-data:ro
      - musicbrainz_data:/musicbrainz-data:ro

  extractor-discogs:
    restart: always
    environment:
      <<: *otel-prod-env
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      RABBITMQ_USERNAME_FILE: /run/secrets/rabbitmq_username
    secrets:
      - rabbitmq_username
      - rabbitmq_password
    deploy:
      replicas: 1

  extractor-musicbrainz:
    restart: always
    environment:
      <<: *otel-prod-env
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      RABBITMQ_USERNAME_FILE: /run/secrets/rabbitmq_username
    secrets:
      - rabbitmq_username
      - rabbitmq_password
    deploy:
      replicas: 1

  graphinator:
    restart: always
    environment:
      <<: *otel-prod-env
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      RABBITMQ_USERNAME_FILE: /run/secrets/rabbitmq_username
    secrets:
      - neo4j_password
      - rabbitmq_username
      - rabbitmq_password

  tableinator:
    restart: always
    environment:
      <<: *otel-prod-env
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USERNAME_FILE: /run/secrets/postgres_username
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      RABBITMQ_USERNAME_FILE: /run/secrets/rabbitmq_username
    secrets:
      - rabbitmq_username
      - rabbitmq_password
      - postgres_username
      - postgres_password

  brainzgraphinator:
    restart: always
    environment:
      <<: *otel-prod-env
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      RABBITMQ_USERNAME_FILE: /run/secrets/rabbitmq_username
    secrets:
      - neo4j_password
      - rabbitmq_username
      - rabbitmq_password

  brainztableinator:
    restart: always
    environment:
      <<: *otel-prod-env
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USERNAME_FILE: /run/secrets/postgres_username
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
      RABBITMQ_USERNAME_FILE: /run/secrets/rabbitmq_username
    secrets:
      - rabbitmq_username
      - rabbitmq_password
      - postgres_username
      - postgres_password

  dashboard:
    restart: always
    environment:
      <<: *otel-prod-env
      # The base file opts out of the console's Secure session cookie for plain-http dev.
      # Environments merge key by key, so without this the opt-out would carry into
      # production. Reset it: the console's Secure default applies, and the production
      # console must be reached over HTTPS (docs/configuration.md).
      SESSION_COOKIE_SECURE: !reset null
      NEO4J_PASSWORD_FILE: /run/secrets/neo4j_password
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USERNAME_FILE: /run/secrets/postgres_username
      GRAFANA_TOKEN_FILE: /run/secrets/grafana_viewer_token
    # Explicit opt-in for a trusted LAN without TLS: GROOVEMAP_ALLOW_INSECURE_CONSOLE=true
    # loads config/console-insecure.true.env, which sets SESSION_COOKIE_SECURE=false. Any
    # other value names a file that does not exist, which `required: false` skips, so the
    # Secure default stands and the render is the same as without this entry. (An
    # environment entry cannot be conditional: `${VAR:+false}` renders "" when unset.)
    env_file:
      - path: config/console-insecure.${GROOVEMAP_ALLOW_INSECURE_CONSOLE:-false}.env
        required: false
    secrets:
      - neo4j_password
      - postgres_username
      - postgres_password
      - grafana_viewer_token

  explore:
    environment:
      <<: *otel-prod-env
    restart: always

  insights:
    restart: always
    environment:
      <<: *otel-prod-env
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USERNAME_FILE: /run/secrets/postgres_username
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      INSIGHTS_INTERNAL_SECRET_FILE: /run/secrets/insights_internal_secret
    secrets:
      - postgres_username
      - postgres_password
      - valkey_password
      - insights_internal_secret

  # A one-shot job, not a long-running service: no restart policy override. The
  # homelab provisions its own embedding_pipeline login and its secrets/ files —
  # this overlay only wires the same _FILE convention every other credential uses.
  embeddings:
    environment:
      <<: *otel-prod-env
      EMBEDDING_PIPELINE_POSTGRES_USERNAME_FILE: /run/secrets/embedding_pipeline_username
      EMBEDDING_PIPELINE_POSTGRES_PASSWORD_FILE: /run/secrets/embedding_pipeline_password
    secrets:
      - embedding_pipeline_username
      - embedding_pipeline_password
