---

# Disposable overlay for the ADR 0010 erasure-and-export assertion
# (`just smoke-erasure`).
#
# The run drives the catalog API over HTTP — register, consent, search,
# recommend, export, erase — and then reads all three stores directly to assert
# that nothing keyed to the user survived. So the only endpoint it needs from
# the host is the API's own, and everything else here exists so the run cannot
# touch, or be blocked by, an operator's environment: its own Compose project
# name, its own subnet, Compose's project-scoped container names instead of the
# fixed ones, and no published port except the API on loopback. PostgreSQL,
# Neo4j, and Redis stay unpublished; the assertions reach them through
# `docker compose exec`.
#
# The internal images are published for one architecture, so the workstation
# running the assertion is often not the architecture the services ship for.
# Naming the platform per service keeps the emulation confined to them and lets
# both stores and the cache stay native. Set SMOKE_ERASURE_SERVICE_PLATFORM to
# the architecture an environment actually promotes.
x-service-platform: &service-platform "${SMOKE_ERASURE_SERVICE_PLATFORM:-linux/amd64}"

services:
  postgres:
    container_name: !reset null
    ports: !override []
  neo4j:
    container_name: !reset null
    ports: !override []
  redis:
    container_name: !reset null
    ports: !override []
  # The telemetry backends the internal services depend on. Compose starts them
  # with the stack even though the assertion never reads a metric or a span.
  victoria-metrics:
    container_name: !reset null
    ports: !override []
  victoria-traces:
    container_name: !reset null
    ports: !override []
  otel-collector:
    container_name: !reset null
    ports: !override []
  schema-init:
    container_name: !reset null
    platform: *service-platform
  api:
    container_name: !reset null
    platform: *service-platform
    # The one endpoint the driver needs. The health port stays unpublished:
    # Compose's own `--wait` reads the container-side healthcheck.
    ports: !override
      - "127.0.0.1:${SMOKE_ERASURE_API_PORT:-18004}:8004"

# The base network pins a fixed subnet so operators can reason about container
# addresses. A smoke run under its own project name would ask for that same
# subnet and be refused while an operator's stack network still holds it, so the
# disposable run takes its own range.
networks:
  groovemap:
    ipam: !override
      config:
        - subnet: "${SMOKE_ERASURE_SUBNET:-172.29.0.0/16}"
