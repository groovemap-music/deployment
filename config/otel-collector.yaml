---

# OpenTelemetry Collector (contrib) configuration for the GrooveMap stack.
#
# Every GrooveMap service PUSHES metrics here over OTLP; nothing scrapes the
# application services. HTTP/protobuf on 4318 is the organisation standard
# (no native gRPC dependency, works for one-shot jobs and stdio processes).
# The gRPC receiver on 4317 stays enabled for future use.
#
# The collector remote-writes every series to VictoriaMetrics, which accepts
# the Prometheus remote-write protocol natively and needs no configuration file
# of its own. Spans take the second pipeline below: they are pushed to
# VictoriaTraces over OTLP/HTTP and, in the same pass, folded into RED span
# metrics by the spanmetrics connector so they land in the metrics store too.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Infrastructure has no OTLP support, so the collector scrapes the exporters
  # on Prometheus' behalf and folds the result into the same pipeline. Job names
  # match the docker-compose service keys, which is what dashboards filter on.
  prometheus:
    config:
      scrape_configs:
        - job_name: rabbitmq
          scrape_interval: 15s
          static_configs:
            - targets: ["rabbitmq:15692"]
        - job_name: postgres-exporter
          scrape_interval: 15s
          static_configs:
            - targets: ["postgres-exporter:9187"]
        - job_name: redis-exporter
          scrape_interval: 15s
          static_configs:
            - targets: ["redis-exporter:9121"]
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ["otel-collector:8888"]
        # 30s, not 15s: cadvisor exports a series per container per device and
        # node-exporter a series per CPU, mode, and filesystem, so these two
        # jobs dominate the sample count. Container and host saturation move
        # over minutes, not seconds, and half the samples still show it.
        - job_name: cadvisor
          scrape_interval: 30s
          static_configs:
            - targets: ["cadvisor:8080"]
        - job_name: node-exporter
          scrape_interval: 30s
          static_configs:
            - targets: ["node-exporter:9100"]

processors:
  # memory_limiter must be the FIRST processor in the pipeline so back-pressure
  # is applied before batching allocates.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 10s
    send_batch_size: 8192
    send_batch_max_size: 16384

exporters:
  prometheusremotewrite:
    http:
      endpoint: http://victoria-metrics:8428/api/v1/write
      tls:
        # Plain HTTP over the internal `groovemap` bridge network. The exporter
        # enables TLS by default, so this must be set explicitly.
        insecure: true
    # Promote OTEL resource attributes (service.name, service.namespace,
    # deployment.environment.name, service.version) to Prometheus labels.
    resource_to_telemetry_conversion:
      enabled: true

  # VictoriaTraces ingests OTLP/HTTP natively on its own insert path. The
  # `http://` scheme already selects plaintext, so no tls block is needed.
  otlphttp/victoria_traces:
    traces_endpoint: http://victoria-traces:10428/insert/opentelemetry/v1/traces

connectors:
  # RED metrics derived from spans, so latency and error rate exist for every
  # instrumented operation without a service emitting a single extra
  # instrument. The namespace makes the Prometheus names
  # `traces_span_metrics_calls_total` and `traces_span_metrics_duration_seconds`.
  spanmetrics:
    namespace: traces.span.metrics
    histogram:
      # Seconds, matching every other GrooveMap histogram, with explicit
      # buckets — the catalog is Prometheus-facing and exponential histograms
      # do not survive remote write intact.
      unit: s
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s]
    # service.name, span.name, span.kind and status.code are the connector's
    # built-in dimensions and are exactly the label set the conventions
    # declare, so no extra dimensions are configured. collector.instance.id is
    # added by default in this version and is dropped: there is one collector
    # in this stack, so it only adds a constant label to every series.
    exclude_dimensions: [collector.instance.id]

extensions:
  # Liveness endpoint for operators and for `docker compose exec`-free probing
  # from another container: http://otel-collector:13133/. The container's own
  # healthcheck cannot use it — the image is distroless and ships no HTTP
  # client — so the healthcheck re-validates the config instead.
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                # Bind to all interfaces: the collector's own prometheus
                # receiver scrapes this endpoint by its compose hostname.
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp, prometheus, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [spanmetrics, otlphttp/victoria_traces]
